name: OnDeck Capital
description: 'OnDeck Capital (ODK Capital, LLC) is one of the largest online small business
  lenders in the United States, providing term loans and business lines of credit to small
  and medium-sized businesses. Founded in 2007 and headquartered in New York, OnDeck uses
  data-driven underwriting and cash-flow analytics to deliver fast funding decisions, and
  has delivered more than $13 billion in financing to over 100,000 businesses across the
  U.S. OnDeck operates as a subsidiary of Enova International and also markets under the
  Headway Capital brand. It surfaced in the API Evangelist network as a portfolio company
  of IVP; OnDeck publishes a public marketing site and an llms.txt resource index but does
  not currently expose a public developer or partner API.'
